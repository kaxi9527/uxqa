name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            native: true
          - runner: macos-15-intel
            target: darwin-x64
            native: true
          - runner: windows-2025
            target: win-x64
            native: false
          - runner: ubuntu-24.04
            target: linux-x64
            native: false
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            native: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: native/model-core/go.mod
          cache-dependency-path: native/model-core/go.sum
      - name: Verify tag and target architecture
        run: node scripts/package/verify-release.mjs '${{ matrix.target }}'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit suite (POSIX permission fixtures)
        if: runner.os != 'Windows'
        run: pnpm test
      - name: Download locked Go modules
        working-directory: native/model-core
        run: go mod download
      - name: Test model core
        working-directory: native/model-core
        run: go test -p 2 ./cmd/uxqa-core ./internal/appdir ./internal/provider
        env:
          GOMAXPROCS: '2'
      - name: Build native macOS app
        if: matrix.native
        run: node scripts/desktop/build.mjs --out release/macos
      - name: Build portable package
        if: ${{ !matrix.native }}
        run: |
          node scripts/package/fetch-node.mjs --target '${{ matrix.target }}' --yes
          node scripts/package/build.mjs --target '${{ matrix.target }}'
      - name: Test actual download package
        run: node scripts/package/verify-release.mjs --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uxqa-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/macos/*.zip
          if-no-files-found: error
          retention-days: 7
  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Collect checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/package/verify-release.mjs --assemble release-assets
          gh release create "$GITHUB_REF_NAME" release-assets/publish/* --verify-tag --draft --title "UXQA $GITHUB_REF_NAME" --notes-file docs/release-notes.md
